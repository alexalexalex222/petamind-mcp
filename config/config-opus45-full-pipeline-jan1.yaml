# Claude Opus 4.5 + Full Titan Pipeline — Jan 1, 2026
#
# Purpose: Benchmark Claude Opus 4.5 through the full pipeline (with refinement loop)
# to compare against Gemini 3 Pro and baseline models.
#
# NOTE: Uses Anthropic's Claude on Vertex AI via the anthropic publisher.
# Model name format: claude-opus-4-5@20251101
#
# Run:
#   .venv/bin/python -m titan_factory.cli run \
#     --max-tasks 25 --run-id opus45-full-25 \
#     -c config/config-opus45-full-pipeline-jan1.yaml

models:
  planner:
    provider: anthropic_vertex
    model: claude-opus-4-5@20251101
    publishable: false
    max_tokens: 4000
    temperature: 0.6

  # Single generator (Opus 4.5) × 2 variants = 2 candidates per task
  ui_generators:
    - provider: anthropic_vertex
      model: claude-opus-4-5@20251101
      publishable: false
      variants: 2
      max_tokens: 65000
      temperature: 0.85

  # Patcher - keep on cheaper model
  patcher:
    provider: vertex
    model: qwen/qwen3-coder-480b-a35b-instruct-maas
    publishable: true
    max_tokens: 9000
    temperature: 0.2

  # Vision judge - use Gemini Flash (multimodal, cheap)
  vision_judge:
    provider: gemini
    model: gemini-3-flash
    publishable: false
    max_tokens: 1500
    temperature: 0.0
    force_adc: true

  # Megamind reasoners - ALL Opus 4.5
  megamind_bold:
    provider: anthropic_vertex
    model: claude-opus-4-5@20251101
    publishable: false
    max_tokens: 4000
    temperature: 0.9

  megamind_minimal:
    provider: anthropic_vertex
    model: claude-opus-4-5@20251101
    publishable: false
    max_tokens: 4000
    temperature: 0.3

  megamind_safe:
    provider: anthropic_vertex
    model: claude-opus-4-5@20251101
    publishable: false
    max_tokens: 4000
    temperature: 0.5

  megamind_synthesizer:
    provider: anthropic_vertex
    model: claude-opus-4-5@20251101
    publishable: false
    max_tokens: 5000
    temperature: 0.4

pipeline:
  skip_judge: false
  vision_score_threshold: 0.0

  selection:
    judge_weight: 0.6
    creativity_weight: 0.4

  refinement:
    skip_for_high_creativity: true
    creativity_skip_threshold: 0.7

  task_prompt_pack: mixed
  generate_edit_tasks: false

  uigen_prompt_variants:
    - id: stacked_all
      input_mode: both
      parts:
        - source: builtin
        - source: file
          path: prompts/titan_ui_system_long.txt
        - source: inline
          text: |
            GLOBAL OVERRIDES (APPLY EVEN IF OTHER PROMPTS CONFLICT):
            - Output must be STRICT JSON. No <think> blocks (Claude doesn't use them). Just output the JSON object directly.
            - No emojis in any text. If an icon is needed, use simple inline SVG (keep icons minimal).
            - Follow the provided brand accent exactly; do not default to violet/purple.
            - Follow the Creative risk dial; avoid boring/generic layouts; keep UX clear and build-safe.

  deterministic_gates_enabled: true
  deterministic_gates_enforce: false

  axe_gate_enabled: true
  axe_fail_impacts: ["critical"]
  axe_timeout_ms: 60000

  lighthouse_gate_enabled: true
  lighthouse_preset: desktop
  lighthouse_timeout_ms: 240000
  lighthouse_min_scores:
    accessibility: 0.80
    performance: 0.00
    best_practices: 0.00
    seo: 0.00

  broken_vision_gate_enabled: true
  broken_vision_gate_min_confidence: 0.85

  megamind_enabled: true
  refinement_enabled: true
  refine_pass2_threshold: 7.0
  refine_pass3_threshold: 8.0
  max_refine_passes: 2
  creative_director_mode: false

  polish_loop_enabled: false
  creativity_refinement_enabled: false

  max_fix_rounds: 2

  model_timeout_ms: 180000
  build_timeout_ms: 240000
  render_timeout_ms: 120000

budget:
  # Opus is expensive - keep concurrency low
  task_concurrency: 1
  concurrency_vertex: 3
  concurrency_gemini: 1
  concurrency_build: 2
  concurrency_render: 2
  requests_per_min_vertex: 20
  max_total_tasks: null
  stop_after_usd: null

export:
  holdout_niches: 0
  validation_split: 0.0
  holdout_niche_ids: []

gcs:
  bucket: null
  prefix: titan-factory-outputs
  upload_interval_tasks: 50
