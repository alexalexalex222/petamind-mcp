# TITAN-4-DESIGN Dataset Factory Configuration (Vertex-only, OSS training run)
#
# This config is meant for "smallish" training runs (like 20 tasks) where we want:
# - public-only teacher chain (publishable=true models)
# - non-empty train/valid output (holdout_niches=0 for tiny runs)
#
# Usage:
#   export GOOGLE_CLOUD_PROJECT=<billed-project>
#   ./.venv/bin/titan-factory run --public-only --max-tasks 20 --run-id oss-20 --config config/config-vertex-oss-train.yaml

models:
  planner:
    provider: vertex
    model: deepseek-ai/deepseek-v3.2-maas
    publishable: true
    max_tokens: 2000
    temperature: 0.7

  ui_generators:
    - provider: vertex
      model: moonshotai/kimi-k2-thinking-maas
      publishable: true
      variants: 2
      max_tokens: 65000
      temperature: 0.8
    - provider: vertex
      model: minimaxai/minimax-m2-maas
      publishable: true
      variants: 2
      max_tokens: 65000
      temperature: 0.8

  patcher:
    provider: vertex
    model: deepseek-ai/deepseek-v3.2-maas
    publishable: true
    max_tokens: 3000
    temperature: 0.2

  # Vision judge is scoring-only (not used as a training target)
  vision_judge:
    provider: gemini
    model: gemini-3-pro-preview
    publishable: false
    max_tokens: 4000
    temperature: 0.1

pipeline:
  vision_score_threshold: 8.0
  max_fix_rounds: 2
  polish_loop_enabled: true
  tasks_per_niche: 7
  total_niches: 100
  model_timeout_ms: 120000
  build_timeout_ms: 240000
  render_timeout_ms: 90000

budget:
  # Run multiple tasks concurrently (the pipeline is async).
  # Provider/build/render steps still enforce their own concurrency limits below.
  task_concurrency: 20
  concurrency_vertex: 5
  concurrency_openrouter: 10
  concurrency_gemini: 2
  concurrency_build: 4
  concurrency_render: 1
  requests_per_min_vertex: 60
  requests_per_min_openrouter: 100
  max_total_tasks: null
  stop_after_usd: null

export:
  # For a 20-task run, holding out 12 niches would often make train/valid empty.
  holdout_niches: 0
  validation_split: 0.08
  holdout_niche_ids: []

gcs:
  bucket: null
  prefix: titan-factory-outputs
  upload_interval_tasks: 50

vertex:
  endpoint_template: "https://{region}-aiplatform.googleapis.com/v1/projects/{project}/locations/{region}/endpoints/openapi/chat/completions"

openrouter:
  base_url: "https://openrouter.ai/api/v1/chat/completions"
