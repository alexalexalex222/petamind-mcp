# Generate 200 landing-type tasks using the EXTENDED prompt pack (SaaS/ecom/docs/pricing/etc.)
# while keeping the rest of the "build-only / accept-all" OSS workflow.
#
# Usage:
#   export GOOGLE_CLOUD_PROJECT=<billed-project>
#   ./.venv/bin/titan-factory run --public-only --max-tasks 200 \
#     --run-id oss_extendedpack_200_run1 \
#     --config config/config-vertex-oss-extendedpack-landing-200.yaml

models:
  planner:
    provider: vertex
    model: deepseek-ai/deepseek-v3.2-maas
    publishable: true
    max_tokens: 2000
    temperature: 0.7

  ui_generators:
    - provider: vertex
      model: moonshotai/kimi-k2-thinking-maas
      publishable: true
      variants: 2
      max_tokens: 12000
      temperature: 0.8
    - provider: vertex
      model: minimaxai/minimax-m2-maas
      publishable: true
      variants: 2
      max_tokens: 12000
      temperature: 0.8

  # Build-error fixer
  patcher:
    provider: vertex
    model: deepseek-ai/deepseek-v3.2-maas
    publishable: true
    max_tokens: 6000
    temperature: 0.2

  # Broken-only vision gate (optional)
  vision_judge:
    provider: gemini
    model: gemini-3-flash-preview
    publishable: false
    max_tokens: 800
    temperature: 0.0

pipeline:
  # Accept-all mode (no winners)
  skip_judge: true
  generate_edit_tasks: false

  # UI generator prompt (TITAN system)
  uigen_system_prompt_path: prompts/titan_ui_system_long.txt

  # NEW: use the extended task prompt pack for planner input
  task_prompt_pack: extended

  # Optional: also filter out clearly broken renders via conservative vision gate
  broken_vision_gate_enabled: true
  broken_vision_gate_min_confidence: 0.85

  max_fix_rounds: 1
  polish_loop_enabled: false
  vision_score_threshold: 0.0

  # Landing-only tasks; 2 per niche => 200 total (100 niches)
  page_type_filter: ["landing"]
  tasks_per_niche: 2
  total_niches: 100

  shuffle_tasks: true
  task_shuffle_seed: 1337

  model_timeout_ms: 120000
  build_timeout_ms: 240000
  render_timeout_ms: 90000

budget:
  task_concurrency: 5
  concurrency_vertex: 20
  concurrency_openrouter: 10
  concurrency_gemini: 5
  concurrency_build: 4
  concurrency_render: 1
  requests_per_min_vertex: 60
  requests_per_min_openrouter: 100
  max_total_tasks: null
  stop_after_usd: null

export:
  holdout_niches: 0
  validation_split: 0.0
  holdout_niche_ids: []

gcs:
  bucket: null
  prefix: titan-factory-outputs
  upload_interval_tasks: 50

vertex:
  endpoint_template: "https://{region}-aiplatform.googleapis.com/v1/projects/{project}/locations/{region}/endpoints/openapi/chat/completions"

openrouter:
  base_url: "https://openrouter.ai/api/v1/chat/completions"
