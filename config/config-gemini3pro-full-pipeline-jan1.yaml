# Gemini 3 Pro + Full Titan Pipeline — Jan 1, 2026
#
# Purpose: Benchmark Gemini 3 Pro Preview through the full pipeline (with refinement loop)
# to compare against baseline models (Kimi/MiniMax).
#
# NOTE: Gemini 3 Pro has tight rate limits. Keep concurrency LOW.
#
# Run:
#   .venv/bin/python -m titan_factory.cli run \
#     --max-tasks 25 --run-id gemini3pro-full-25 \
#     -c config/config-gemini3pro-full-pipeline-jan1.yaml

models:
  planner:
    provider: gemini
    model: gemini-3-pro-preview
    publishable: false
    max_tokens: 8000
    temperature: 0.6
    force_adc: true

  # Single generator (Gemini 3 Pro) × 2 variants = 2 candidates per task
  # MAX OUTPUT for full landing pages (hero + features + pricing + FAQ + footer)
  ui_generators:
    - provider: gemini
      model: gemini-3-pro-preview
      publishable: false
      variants: 2
      max_tokens: 65000  # Gemini 3 Pro supports up to 65k
      temperature: 0.85
      force_adc: true

  # Patcher - Gemini 3 Pro (ALL GEMINI for this benchmark)
  patcher:
    provider: gemini
    model: gemini-3-pro-preview
    publishable: false
    max_tokens: 65000  # Needs room for full file rewrites
    temperature: 0.2
    force_adc: true

  # Vision judge - Gemini Flash (Gemini 3 Pro returns <think> tags that break JSON parsing)
  vision_judge:
    provider: gemini
    model: gemini-3-flash
    publishable: false
    max_tokens: 1500
    temperature: 0.0
    force_adc: true

  # Megamind reasoners - ALL Gemini 3 Pro
  # Higher tokens for richer, more detailed section plans
  megamind_bold:
    provider: gemini
    model: gemini-3-pro-preview
    publishable: false
    max_tokens: 65000
    temperature: 0.9
    force_adc: true

  megamind_minimal:
    provider: gemini
    model: gemini-3-pro-preview
    publishable: false
    max_tokens: 65000
    temperature: 0.3
    force_adc: true

  megamind_safe:
    provider: gemini
    model: gemini-3-pro-preview
    publishable: false
    max_tokens: 65000
    temperature: 0.5
    force_adc: true

  megamind_synthesizer:
    provider: gemini
    model: gemini-3-pro-preview
    publishable: false
    max_tokens: 16000  # Synthesizer needs more room to merge 3 plans
    temperature: 0.4
    force_adc: true

pipeline:
  skip_judge: false
  vision_score_threshold: 0.0

  selection:
    judge_weight: 0.6
    creativity_weight: 0.4

  refinement:
    skip_for_high_creativity: true
    creativity_skip_threshold: 0.7

  task_prompt_pack: mixed
  generate_edit_tasks: false

  uigen_prompt_variants:
    - id: stacked_all
      input_mode: both
      parts:
        - source: builtin
        - source: file
          path: prompts/titan_ui_system_long.txt
        - source: inline
          text: |
            GLOBAL OVERRIDES (APPLY EVEN IF OTHER PROMPTS CONFLICT):
            - Output must be STRICT: <think>...</think> followed by ONE valid JSON object.
            - No emojis in any text. If an icon is needed, use simple inline SVG (keep icons minimal).
            - Follow the provided brand accent exactly; do not default to violet/purple.
            - Follow the Creative risk dial; avoid boring/generic layouts; keep UX clear and build-safe.

  deterministic_gates_enabled: true
  deterministic_gates_enforce: false

  axe_gate_enabled: true
  axe_fail_impacts: ["critical"]
  axe_timeout_ms: 60000

  lighthouse_gate_enabled: true
  lighthouse_preset: desktop
  lighthouse_timeout_ms: 240000
  lighthouse_min_scores:
    accessibility: 0.80
    performance: 0.00
    best_practices: 0.00
    seo: 0.00

  broken_vision_gate_enabled: true
  broken_vision_gate_min_confidence: 0.85

  megamind_enabled: true
  refinement_enabled: true
  refine_pass2_threshold: 7.0
  refine_pass3_threshold: 8.0
  max_refine_passes: 2
  creative_director_mode: false

  polish_loop_enabled: false
  creativity_refinement_enabled: false

  max_fix_rounds: 5

  model_timeout_ms: 180000  # Longer timeout for thinking model
  build_timeout_ms: 240000
  render_timeout_ms: 120000

budget:
  # LOW concurrency to avoid rate limits
  task_concurrency: 1
  concurrency_vertex: 5
  concurrency_gemini: 1
  concurrency_build: 2
  concurrency_render: 2
  requests_per_min_vertex: 30
  max_total_tasks: null
  stop_after_usd: null

export:
  holdout_niches: 0
  validation_split: 0.0
  holdout_niche_ids: []

gcs:
  bucket: null
  prefix: titan-factory-outputs
  upload_interval_tasks: 50
